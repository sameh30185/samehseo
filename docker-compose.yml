services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sameh
      POSTGRES_PASSWORD: sameh
      POSTGRES_DB: sameh
    ports:
      - "5432:5432"
    volumes:
      - sameh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sameh -d sameh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://sameh:sameh@postgres:5432/sameh?sslmode=disable
      SESSION_SECRET: dev-session-secret-change-me
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      HTTP_ADDR: ":8080"
      MIGRATIONS_DIR: /app/migrations
      COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sameh_pg:
